[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelab"
version = "0.2.0"
description = "Provider-agnostic A/B testing for LLM systems"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
keywords = ["llm", "ab-testing", "experiments", "feature-flags"]
dependencies = []
authors = [
    { name = "elliot736" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/elliot736/modelab"
Repository = "https://github.com/elliot736/modelab"
Issues = "https://github.com/elliot736/modelab/issues"
Changelog = "https://github.com/elliot736/modelab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psycopg[binary,pool]>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["modelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: tests that require Docker (deselect with '-m not docker')",
]
addopts = "--cov=modelab --cov-report=term-missing -m 'not docker'"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "UP007",  # Use X | Y (already used, but avoid forcing on older annotations)
    "B008",   # Do not perform function call in argument defaults (standard FastAPI pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["modelab", "server"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "pip install build && python -m build"
commit_message = "chore(release): v{version}"
major_on_zero = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
token = { env = "RELEASE_TOKEN" }
