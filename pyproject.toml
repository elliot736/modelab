[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelab"
version = "0.1.0"
description = "Provider-agnostic A/B testing for LLM systems"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
keywords = ["llm", "ab-testing", "experiments", "feature-flags"]
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psycopg[binary,pool]>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["modelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: tests that require Docker (deselect with '-m not docker')",
]
