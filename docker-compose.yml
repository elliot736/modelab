services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: modelab
      POSTGRES_PASSWORD: modelab
      POSTGRES_DB: modelab
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelab"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: .
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: postgresql://modelab:modelab@db:5432/modelab
      MODELAB_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
